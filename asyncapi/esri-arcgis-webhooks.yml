gaps:
  - No AsyncAPI (or other machine-readable) description of the payload schema is published.
  - >-
    No HMAC request signing - the shared secret is placed in a header rather than used to sign the body,
    so a receiver cannot verify payload integrity.
  - No documented redelivery/replay endpoint; failed deliveries lead to auto-deactivation instead.
