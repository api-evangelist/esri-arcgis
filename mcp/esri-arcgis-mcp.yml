name: MCP for ArcGIS Location Services (beta)
status: beta
description: An Esri-hosted, remote Model Context Protocol server that exposes ArcGIS Location Services
  (geocoding, reverse geocoding, routing, elevation, static maps and GeoEnrichment) to MCP-compliant clients
  as tools, without the client calling the ArcGIS REST APIs directly. Announced as beta in the ArcGIS
  Location Platform release and documented in Esri's own developer documentation.
