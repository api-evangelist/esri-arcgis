tools_source: https://developers.arcgis.com/ai/mcp-arcgis-location-services/tools/
tools:
- name: find_address_candidates
  category: geocoding
  description: Takes an address or place string and returns coordinates.
  privileges:
  - Location services > Geocoding > Geocode (stored)
- name: reverse_geocode
  category: geocoding
  description: Converts coordinates to the nearest address.
  privileges:
  - Location services > Geocoding > Geocode (stored)
- name: solve_route
  category: routing
  description: Solves a route between a start and end point, with optional intermediate stops and the
    ability to specify departure time for more accurate results.
  privileges:
  - Location services > Routing > Simple routing
- name: elevation_at_locations
  category: elevation
  description: Get the elevation for a given point (latitude and longitude) using the WGS84 coordinate
    system.
  privileges:
  - Location services > Elevation
- name: map_with_overlay
  category: static-maps
  description: Returns a static map in an ArcGIS Basemap style with points, polylines and/or polygons.
  privileges:
  - Location services > Static maps
  note: Returns a base64-encoded PNG image; some MCP clients do not decode or render it.
- name: get_topic_fields
  category: data-enrichment
  description: Returns a set of fields for a topic (e.g. "population") that are available for a specified
    country.
  privileges:
  - Location services > Geoenrichment
- name: describe_location
  category: data-enrichment
  description: Describes the specified location using the fields obtained from get_topic_fields.
  privileges:
  - Location services > Geoenrichment
