  name: ArcGIS Urban API
  description: >-
    A GraphQL API for ArcGIS Urban - urban models, plans, projects, branches, parcels, zones, spaces,
    building types, indicators, metrics, overlays, viewpoints and scenario analyses (elevation profile,
    line of sight, shadowcast, viewshed, suitability, sunlight). Anonymous introspection is open, so the
