  - service: ArcGIS Geocoding service
    date: '2026-06'
    breaking: false
    additions:
      - New request parameter interpolatePointAddress on findAddressCandidates and geocodeAddresses.
      - New Addr_type output value PointAddressInt for interpolated point addresses.
      - New MatchNarrative code value "b" indicating PointAddress interpolation matched the house number.
    highlights:
      - Geocoding quality improved in Austria, Belgium, Colombia, India, Italy, Mexico, Norway, Poland, Portugal, Puerto Rico, Rwanda, Svalbard and Switzerland.
