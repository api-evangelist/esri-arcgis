source: live GET of the named /.well-known/ paths on every host in apis.yml, every OpenAPI servers[] host, the docs host, and the MCP host
provider: Esri ArcGIS
providerId: esri-arcgis
note: >-
  Two real documents are served. www.arcgis.com (and the apex arcgis.com) publish RFC 8414 OAuth 2.0
  Authorization Server Metadata; the Esri-hosted MCP server publishes RFC 9728 OAuth 2.0 Protected
  Resource Metadata pointing back at arcgis.com as its authorization server. No security.txt,
  api-catalog, openid-configuration, ai-plugin.json or agent card is served anywhere. A 404 body on
  developers.arcgis.com / location.arcgis.com is the docs SPA shell; on the *-api.arcgis.com hosts it is
  the ArcGIS REST JSON error envelope.
