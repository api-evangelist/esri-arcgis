# ArcGIS Urban API — GraphQL SDL
# Source: https://urban-api.arcgis.com/graphql (anonymous introspection, HTTP 200)
# Docs:   https://developers.arcgis.com/arcgis-urban-api/

schema {
  query: Query
  mutation: Mutation
}

"""
**Organization**: All members of the organization have access.
**Private**: Owner of the item has access.
**Public**: People outside the organization have access.
**Shared**: People of specific groups have access.
**Unknown**: Access level is unknown.
"""
enum AccessLevel {
  Organization
  Private
  Public
  Shared
  Unknown
}

"""JSON object with space use type reference and target distribution."""
type AllowedSpaceUseType {
  """ID of the space use type that is allowed in the zoning type."""
  spaceUseTypeID: GlobalID!
  """Target distribution of the space use type."""
  targetDistribution: Float
}

input AllowedSpaceUseTypeInput {
  """ID of the space use type that is allowed in the zoning type."""
  spaceUseTypeID: GlobalID!
  """
  Target distribution of the space use type.

Minimum value: 0.001
Maximum value: 1
  """
  targetDistribution: Float
}

type Analysis {
  attributes: AnalysisAttributes!
}

type AnalysisAttributes {
  """Unique identifier (UUID) of the feature."""
  GlobalID: GlobalID!
  """Custom ID of the feature. Used to join fields in the data manager."""
  CustomID: String
  """Name of the Analysis."""
  AnalysisName: String!
  """Description"""
  Description: String
  """Parameters that need to be configured to perform the analysis, related to the calculation as well as map interactions."""
  Parameters: AnalysisParameter!
  """ID of the urban event (plan or project) the analysis belongs to."""
  UrbanEventID: GlobalID
  """The order in which the model is displayed in the UI."""
  DisplayOrder: Int!
  """URL of the thumbnail image for the analysis, or null if there isn't one.'"""
  Thumbnail: String
}

input AnalysisFilterInput {
  globalIDs: [GlobalID!]
}

type AnalysisMeta implements FeaturesMeta {
  """The number of analysis."""
  count: Int
  """Last recorded edit made to analysis"""
  lastEdit: LastEditMeta
}

union AnalysisParameter = ElevationProfile | LineOfSight | Shadowcast | Viewshed | Suitability | Sunlight

"""A branch is a design scenario in a plan or project."""
type Branch {
  attributes: BranchAttributes!
}

"""Attributes of the branch."""
type BranchAttributes {
  """Unique identifier (UUID) of the feature."""
  GlobalID: GlobalID!
  """Name of the branch."""
  BranchName: String!
  """The order of the branch."""
  BranchOrder: Int!
  """Portal item id of a web scene whose layers are shown as context layers when editing scenarios (only visible in the scenario)."""
  ContextWebsceneItemId: PortalItemId
  """Portal item id of an Elevation Layer."""
  CustomElevationLayerItemId: PortalItemId
  """Custom ID of the feature. Used to join fields in the data manager."""
  CustomID: String
  """Description for the branch shown in the scenario switcher."""
  Description: String
  """If `true`, the branch represents existing conditions."""
  Existing: Boolean!
  """If `true`, the branch is partially locked. Can be used by clients to prevent accidental editing of branches."""
  Locked: Boolean!
  """A polygon masking out existing buildings and existing trees."""
  MaskingGeometry: Polygon
  """Array of Media Layer portal item ids with layer order."""
  MediaLayers: [MediaLayer!]
  """ID of the urban event (plan or project) the branch (scenario) belongs to."""
  UrbanEventID: GlobalID!
  """Portal item id of a web scene whose layers are added as visualization of the design in the scenario. The portal item can also be a single layer (e.g., SceneLayer)."""
  WebsceneItemId: PortalItemId
  """The last recorded edit."""
  LastEdit: LastEdit
}

"""Filters which can be applied to branch queries."""
input BranchFilterInput {
  globalIDs: [GlobalID!]
  overviewVisualization: Boolean
  branchNames: [String!]
  branchOrders: [Int!]
  branchOrderIsLessThan: Int
  branchOrderIsGreaterThan: Int
  contextWebsceneItemIds: [PortalItemId!]
  customElevationLayerItemIds: [PortalItemId!]
  customIds: [String!]
  descriptions: [String!]
  existing: Boolean
  locked: Boolean
  urbanEventIds: [GlobalID!]
  websceneItemIds: [PortalItemId!]
}

enum BranchSortBy {
  BranchName
  BranchOrder
}

input BranchSortInput {
  direction: SortDirection = ASC
  sortBy: BranchSortBy!
}

type BranchesMeta implements FeaturesMeta {
  """The number of branches."""
  count: Int
  """Last recorded edit made to branches"""
  lastEdit: LastEditMeta
}

"""
**Front**: Building is aligned to front edge(s) of the parcel.
**Side**: Building is aligned to side edge(s) of the parcel.
**Rear**: Building is aligned to rear edge(s) of the parcel.
"""
enum BuildingAlignment {
  Front
  Side
  Rear
}

"""Configuration of the building part such as space use and floor ranges."""
type BuildingPart {
  """If `true`, the spaces in the building part should be excluded from GFA / FAR calculations."""
  gfaIgnore: Boolean!
  """The floor range of the building part."""
  numFloors: NumFloors!
  """ID of the space use type that is assigned to the building part."""
  spaceUseTypeID: GlobalID!
}

input BuildingPartInput {
  """If `true`, the spaces in the building part should be excluded from GFA / FAR calculations."""
  gfaIgnore: Boolean! = false
  """The floor range of the building part."""
  numFloors: NumFloorsInput!
  """ID of the space use type that is assigned to the building part."""
  spaceUseTypeID: GlobalID!
}

"""A building type is a template used to build out future buildings respecting the zoning code in plans."""
