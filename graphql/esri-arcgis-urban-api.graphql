  multipleBuildingsDensities: [Float!]
  multipleBuildingsDensityIsLessThan: Float
  multipleBuildingsDensityIsGreaterThan: Float
  multipleBuildingsDistances: [Float!]
  multipleBuildingsDistanceIsLessThan: Float
  multipleBuildingsDistanceIsGreaterThan: Float
  multipleBuildingsEnabled: Boolean
  proposal: Boolean
  segmentLengthMins: [Float!]
  segmentLengthMinIsLessThan: Float
  segmentLengthMinIsGreaterThan: Float
  segmentWidthMins: [Float!]
